<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biome Auditioner — M5</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232c;
    --line: #2a323d;
    --text: #d8dee6;
    --muted: #8b949e;
    --accent: #58a6ff;
    --warn: #e3b341;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
  }

  #panel {
    width: 320px;
    flex: 0 0 320px;
    height: 100vh;
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 14px 14px 40px;
  }
  #panel::-webkit-scrollbar { width: 10px; }
  #panel::-webkit-scrollbar-thumb { background: #2f3843; border-radius: 5px; }

  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 14px; }

  .section { margin-bottom: 6px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .section > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    margin: 0; padding: 7px 10px; background: var(--panel-2); color: var(--muted);
    cursor: pointer; user-select: none; display: flex; justify-content: space-between;
  }
  .section > .body { padding: 8px 10px 10px; display: block; }
  .section.collapsed > .body { display: none; }

  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row > label { flex: 1 1 auto; font-size: 11.5px; color: var(--text); }
  .row > .val { flex: 0 0 62px; text-align: right; font-variant-numeric: tabular-nums;
                color: var(--muted); font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 18px; }
  .slider-wrap { margin: 2px 0 8px; }
  input[type=text], select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px;
  }
  .check { display: flex; align-items: center; gap: 7px; margin: 4px 0; font-size: 12px; cursor: pointer; }
  .check input { accent-color: var(--accent); }

  button {
    width: 100%; padding: 8px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; cursor: pointer;
  }
  button:hover { background: #242c36; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  button.primary:hover { background: #2a7bf5; }
  button.primary:disabled { background: var(--panel-2); border-color: var(--line);
                            color: var(--muted); cursor: default; font-weight: 400; }
  .btn-row { display: flex; gap: 6px; margin-bottom: 10px; }

  .kv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kv b { color: var(--text); font-weight: 600; }
  .kv div { display: flex; justify-content: space-between; padding: 1px 0; gap: 10px; }
  .kv i { font-style: normal; }

  .rows { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rows b { color: var(--text); font-weight: 600; }
  .rows div { display: flex; justify-content: space-between; padding: 2px 0;
              border-bottom: 1px solid #202733; gap: 10px; }
  .rows div:last-child { border-bottom: 0; }

  #view { flex: 1 1 auto; position: relative; height: 100vh; }
  #map { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #readout {
    position: absolute; left: 10px; bottom: 10px;
    background: rgba(14,17,22,.85); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 9px; font-size: 11.5px; font-variant-numeric: tabular-nums;
    pointer-events: none; color: var(--text); white-space: pre;
  }
  #status {
    position: absolute; right: 10px; top: 10px;
    background: rgba(14,17,22,.85); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 9px; font-size: 11.5px; pointer-events: none; color: var(--muted);
  }
  #status.busy { color: var(--warn); border-color: var(--warn); }
  .hint { font-size: 10.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .note { font-size: 10.5px; color: var(--muted); margin: 6px 0 2px; font-style: italic; }
</style>
</head>
<body>
  <div id="panel">
    <h1>Biome Auditioner</h1>
    <div class="sub">Milestone 5 — Variant sweeps</div>
    <div class="btn-row">
      <button id="bake" class="primary">Bake</button>
      <button id="reroll" style="flex:0 0 90px">Reroll</button>
    </div>
    <div id="controls"></div>
  </div>
  <div id="view">
    <canvas id="map"></canvas>
    <div id="status">ready</div>
    <div id="readout"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
